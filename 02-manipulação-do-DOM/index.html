<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>

<body>
    <div class="container">
        <p id="paragrafo">Parágrafo</p>
        <button id="btn">OK</button>
    </div>

    <script>
      const botao = document.querySelector('button');
      botao.addEventListener('click', minhaFuncao);
      
      function minhaFuncao() {
        const parag = document.getElementById('paragrafo');
        parag.textContent = 'Parágrafo alterado!';
      }

      const meuBotao = document.querySelector('#meuBotao')
      meuBotao.addEventListener('mouseover', () => {
        const container = document.querySelector('.container');
        container.innerHTML += 'Texto alterado com Arrow Function!';
        container.style = 'color: white; background-color: red; font-size: 20px; font-weight: bold;';
      });
    </script>
</body>

</html>
